services:
  recast:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-500}
      PASTE_MAX_KB: ${PASTE_MAX_KB:-256}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    restart: unless-stopped
